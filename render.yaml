services:
  - type: web
    name: live-team-quiz
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: quiz-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST_PIN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/quiz.sqlite
      - key: CAMERA_SERVICE_URL
        value: https://live-team-quiz-camera.onrender.com
      - key: CAMERA_SERVICE_TOKEN
        sync: false

  - type: web
    name: live-team-quiz-camera
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn camera_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CAMERA_SERVICE_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
